# .github/workflows/jevons_hourly.yml
#
# Every hour, and whenever the site or the code changes on main: fetch the new
# Bitcoin Cash blocks, read BCH/USD, recompute the Jevons' value, commit the
# inputs to the chain-data branch and deploy the site (site/ plus the fresh
# xju.json) to GitHub Pages.
#
# The first run fetches the chain's history from its first block and takes hours;
# a run cut short by its time budget keeps what it fetched and the next carries on.
#
# Set once on GitHub, by hand: Settings, Pages, Source = "GitHub Actions".

name: Jevons hourly

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "service/**"
      - ".github/workflows/jevons_hourly.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jevons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_BRANCH: chain-data
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          path: main

      - name: Self-check
        run: python3 main/service/jevons.py selfcheck

      - name: Get the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" "$url" data
          elif [ "$rc" = 2 ]; then
            echo "no $DATA_BRANCH branch yet: starting one"
            git init --quiet --initial-branch "$DATA_BRANCH" data
            git -C data remote add origin "$url"
          else
            echo "could not read the repository's branches (git ls-remote exit $rc)"
            exit 1
          fi

      - name: Fetch new blocks, read the price and compute
        id: update
        run: |
          rc=0
          python3 main/service/jevons.py update --data data --budget-minutes 300 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit the inputs
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            if [ -f xju.json ]; then
              height=$(python3 -c 'import json; print(json.load(open("xju.json"))["height"])')
            else
              height="(no value yet)"
            fi
            git commit --quiet -m "XJU: height $height"
            git push --quiet origin "HEAD:$DATA_BRANCH"
          fi

      - name: Assemble the site
        id: site
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        run: |
          if [ -f data/xju.json ]; then
            mkdir _site
            cp -R main/site/. _site/
            cp data/xju.json _site/xju.json
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no xju.json yet: nothing to deploy this run"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the site
        if: steps.site.outputs.ready == 'yes'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy the site
        if: steps.site.outputs.ready == 'yes'
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Mark the run failed if the update was held or failed
        if: steps.update.outputs.rc != '0'
        run: |
          echo "the update exited ${{ steps.update.outputs.rc }}: 2 = held (what there is was published), 1 = failed"
          exit 1
