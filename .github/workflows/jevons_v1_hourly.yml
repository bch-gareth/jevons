# .github/workflows/jevons_v1_hourly.yml
#
# Every hour: fetch the new Bitcoin Cash blocks, recompute the Jevons' v1 value,
# commit the per-block inputs to the v1-data branch and deploy the site
# (site/ plus the fresh v1.json) to GitHub Pages.
#
# The first run fetches the whole history from 2014 and takes hours; a run cut
# short by its time budget keeps what it fetched and the next run carries on.
#
# Set once on GitHub, by hand: Settings, Pages, Source = "GitHub Actions".

name: Jevons v1 hourly

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jevons-v1
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_BRANCH: v1-data
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          path: main

      - name: Self-check
        run: python3 main/service/jevons_v1.py selfcheck

      - name: Get the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" "$url" data
          elif [ "$rc" = 2 ]; then
            echo "no $DATA_BRANCH branch yet: starting one"
            git init --quiet --initial-branch "$DATA_BRANCH" data
            git -C data remote add origin "$url"
          else
            echo "could not read the repository's branches (git ls-remote exit $rc)"
            exit 1
          fi

      - name: Fetch new blocks and compute
        id: update
        run: |
          rc=0
          python3 main/service/jevons_v1.py update --data data --budget-minutes 300 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit the inputs
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            height=$(python3 -c 'import json; print(json.load(open("v1.json"))["height"])')
            git commit --quiet -m "v1: height $height"
            git push --quiet origin "HEAD:$DATA_BRANCH"
          fi

      - name: Assemble the site
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        run: |
          mkdir _site
          cp -R main/site/. _site/
          cp data/v1.json _site/v1.json

      - name: Upload the site
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy the site
        if: steps.update.outputs.rc == '0' || steps.update.outputs.rc == '2'
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Mark the run failed if the update was held or failed
        if: steps.update.outputs.rc != '0'
        run: |
          echo "the update exited ${{ steps.update.outputs.rc }}: 2 = held at a gap (what there is was published), 1 = failed"
          exit 1
